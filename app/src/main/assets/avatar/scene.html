<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}canvas{width:100%;height:100%;display:block}#fallback{font:600 18px sans-serif;color:#aaa;position:absolute;inset:0;display:grid;place-items:center;letter-spacing:.06em}#fallback:before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff4f70,#d500f9 55%,#120016);filter:blur(.5px);opacity:.7;box-shadow:0 0 60px #ff174466}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"}}</script></head><body><div id="fallback">ELINA</div><script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'; import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';
const fallback=document.getElementById('fallback'); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050505); const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.1,100); camera.position.set(0,1.35,3.4);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x201020,2.2)); const key=new THREE.DirectionalLight(0xffffff,2.5); key.position.set(2,3,3); scene.add(key); const rim=new THREE.DirectionalLight(0xff1744,1.4); rim.position.set(-2,1,-2); scene.add(rim);
let vrm=null,expressions=null; const loader=new GLTFLoader(); loader.register(p=>new VRMLoaderPlugin(p)); loader.load('https://appassets.androidplatform.net/assets/avatar/elina.vrm',g=>{ vrm=g.userData.vrm; if(vrm){VRMUtils.removeUnnecessaryVertices(g.scene); vrm.scene.rotation.y=Math.PI; scene.add(vrm.scene); expressions=vrm.expressionManager; fallback.style.display='none'; window.ElinaNative?.ready();}},undefined,e=>{fallback.textContent='ELINA • AVATAR UNAVAILABLE'; console.error(e); window.ElinaNative?.ready();});
function emotion(name,a){ if(!expressions)return; const map={happy:['Joy','Fun'],angry:['Angry'],sad:['Sorrow'],surprised:['Surprised'],neutral:['Neutral'],thinking:['Extra'],worried:['Sorrow'],blushing:['Joy'],shy:['Joy'],embarrassed:['Surprised'],excited:['Joy'],confused:['Extra'],sleepy:['Sorrow'],serious:['Angry']}; for(const n of Object.keys(map))for(const p of map[n]){ if(expressions.getExpression(p)) expressions.setValue(p,n===name?a:0); }}
function lip(shape,a){ if(!expressions)return; const names={aa:'A',ih:'I',ou:'U',ee:'E',oh:'O'}; for(const p of Object.values(names)) expressions.setValue(p,0); expressions.setValue(names[shape]||'A',a); }
window.elina={emotion,lip,blink:()=>{if(expressions){expressions.setValue('Blink',1);setTimeout(()=>expressions.setValue('Blink',0),110)}},look:(x,y)=>{const head=vrm?.humanoid?.getNormalizedBoneNode?.("head"); if(head){head.rotation.y=x*.25;head.rotation.x=-y*.16;}},};
function tick(t){requestAnimationFrame(tick); if(vrm?.scene){vrm.scene.position.y=Math.sin(t/3200)*.006; vrm.update(t/1000);} renderer.render(scene,camera)} requestAnimationFrame(tick); addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
