name: Build ElinaAI APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinaAi2.0-fixed-v36.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract ZIP and find Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ElinaAi2.0-fixed-v36.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Missing $ZIP_FILE in the repository root."
            exit 1
          fi

          rm -rf build-src
          mkdir -p build-src
          unzip -q "$ZIP_FILE" -d build-src

          GRADLEW_PATH="$(find build-src -type f -name gradlew -print -quit)"

          if [[ -z "$GRADLEW_PATH" ]]; then
            echo "::error::No gradlew was found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="${GRADLEW_PATH%/gradlew}"

          test -f "$PROJECT_DIR/settings.gradle.kts" || {
            echo "::error::settings.gradle.kts not found in $PROJECT_DIR"
            exit 1
          }

          test -f "$PROJECT_DIR/app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts not found in $PROJECT_DIR"
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || {
            echo "::error::AndroidManifest.xml not found in $PROJECT_DIR"
            exit 1
          }

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          if [[ ! -d "$APK_DIR" ]]; then
            echo "::error::APK output directory was not created."
            exit 1
          fi

          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk")

          if [[ "${#APKS[@]}" -eq 0 ]]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          if [[ "${#APKS[@]}" -gt 1 ]]; then
            echo "::error::More than one APK was produced. Refusing to guess."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          APK="${APKS[0]}"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"

          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          cp "$APK" "ElinaAI-v36-release.apk"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "Built APK:"
          ls -lh "$APK" "ElinaAI-v36-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-v36-release-apk
          path: ElinaAI-v36-release.apk
          if-no-files-found: error
          retention-days: 7
