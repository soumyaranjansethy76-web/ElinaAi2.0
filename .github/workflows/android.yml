name: Android Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elina-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - name: Configure release signing when secrets exist
        env:
          ELINA_KEYSTORE_BASE64: ${{ secrets.ELINA_KEYSTORE_BASE64 }}
          ELINA_KEYSTORE_PASSWORD: ${{ secrets.ELINA_KEYSTORE_PASSWORD }}
          ELINA_KEY_ALIAS: ${{ secrets.ELINA_KEY_ALIAS }}
          ELINA_KEY_PASSWORD: ${{ secrets.ELINA_KEY_PASSWORD }}
        run: |
          if [ -n "$ELINA_KEYSTORE_BASE64" ]; then
            echo "$ELINA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elina-release.jks"
            echo "ELINA_KEYSTORE_PATH=$RUNNER_TEMP/elina-release.jks" >> "$GITHUB_ENV"
            echo "ELINA_KEYSTORE_PASSWORD=$ELINA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ELINA_KEY_ALIAS=$ELINA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ELINA_KEY_PASSWORD=$ELINA_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: elina-release-apk
          path: app/build/outputs/apk/release/*.apk
