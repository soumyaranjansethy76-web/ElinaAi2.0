name: Build ElinaAI Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "=== Checking project files ==="

          test -f gradlew || {
            echo "::error::gradlew is missing from the repository root."
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "::error::app/build.gradle.kts is missing."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          }

          test -f app/src/main/assets/avatar/elina.vrm || {
            echo "::error::app/src/main/assets/avatar/elina.vrm is missing. Check that the file was committed to the repository."
            exit 1
          }

          chmod +x gradlew

          echo "=== Project verification passed ==="
          echo "VRM asset found:"
          ls -lh app/src/main/assets/avatar/elina.vrm

      - name: Show Android environment
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK found at:"
            echo "$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK found at:"
            echo "$ANDROID_SDK_ROOT"
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          else
            echo "::error::Android SDK was not found on the GitHub runner."
            exit 1
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "=== Starting Gradle release build ==="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify exactly one APK
        shell: bash
        run: |
          set -e

          APK_DIR="app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Expected output directory $APK_DIR does not exist."
            echo "::error::assembleRelease did not produce the expected output directory."
            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk"
          )

          echo "Found ${#APKS[@]} APK(s) in $APK_DIR:"
          printf '  %s\n' "${APKS[@]}"

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          if [ "${#APKS[@]}" -gt 1 ]; then
            echo "::error::Found ${#APKS[@]} APKs. Expected exactly one APK."
            exit 1
          fi

          APK="${APKS[0]}"

          if [ ! -f "$APK" ]; then
            echo "::error::$APK is not a regular file."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=== APK found ==="
          ls -lh "$APK"

      - name: Verify signing
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            echo "::error::Android SDK path is unavailable."
            exit 1
          fi

          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools"

          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android build-tools directory was not found at $BUILD_TOOLS_DIR"
            exit 1
          fi

          SDK_BUILD_TOOLS=$(
            find "$BUILD_TOOLS_DIR" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$SDK_BUILD_TOOLS" ]; then
            echo "::error::No Android build-tools version was found."
            exit 1
          fi

          APKSIGNER="$SDK_BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found at $APKSIGNER"
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo "=== APK signing verification passed ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-release-apk
          path: "${{ env.APK }}"
          if-no-files-found: error
          retention-days: 7
