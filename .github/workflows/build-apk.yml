name: Build ElinaAI Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project
        shell: bash
        run: |
          set -e
          test -f gradlew || { echo "::error::gradlew is missing from the repository root."; exit 1; }
          test -f settings.gradle.kts || { echo "::error::settings.gradle.kts is missing from the repository root."; exit 1; }
          test -f build.gradle.kts || { echo "::error::root build.gradle.kts is missing from the repository root."; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::app/build.gradle.kts is missing."; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml is missing."; exit 1; }
          test -f app/src/main/assets/avatar/model.vrm || { echo "::error::app/src/main/assets/avatar/model.vrm is missing. Check that it was actually committed (not excluded by .gitignore)."; exit 1; }
          chmod +x gradlew

      - name: Build signed release APK
        shell: bash
        run: |
          set -e
          # A failure here is a real Gradle error (dependency resolution, compilation,
          # resource linking, or signing) — see the Gradle output directly above for the
          # exact task that failed and why. Nothing below hides or replaces that error.
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify exactly one APK
        shell: bash
        run: |
          set -e
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Expected output directory $APK_DIR does not exist — assembleRelease did not produce it."
            exit 1
          fi
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk")
          echo "Found ${#APKS[@]} APK(s) in $APK_DIR:"
          printf '  %s\n' "${APKS[@]}"
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced in $APK_DIR."
            exit 1
          fi
          if [ "${#APKS[@]}" -gt 1 ]; then
            echo "::error::Found ${#APKS[@]} APKs in $APK_DIR, expected exactly 1. Refusing to guess which one to upload."
            exit 1
          fi
          APK="${APKS[0]}"
          test -f "$APK" || { echo "::error::$APK is not a regular file."; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Verify signing
        shell: bash
        run: |
          set -e
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$SDK_BUILD_TOOLS" ]; then
            echo "::error::No Android build-tools directory found under \$ANDROID_HOME — cannot verify signing."
            exit 1
          fi
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK" || {
            echo "::error::apksigner could not verify the signature on $APK — the release APK is not properly signed and will not install.";
            exit 1;
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElinaAI-release-apk
          path: "${{ env.APK }}"
          if-no-files-found: error
          retention-days: 7
